<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#3d1515"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#aa8c2c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- Boxing ring ropes -->
  <line x1="50" y1="180" x2="350" y2="180" stroke="#8b0000" stroke-width="4"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#8b0000" stroke-width="4"/>
  <line x1="50" y1="220" x2="350" y2="220" stroke="#8b0000" stroke-width="4"/>
  <!-- Ring posts -->
  <rect x="45" y="170" width="15" height="60" fill="#333"/>
  <rect x="340" y="170" width="15" height="60" fill="#333"/>
  <!-- Boxing gloves silhouette -->
  <ellipse cx="160" cy="120" rx="45" ry="40" fill="#8b0000"/>
  <ellipse cx="240" cy="120" rx="45" ry="40" fill="#8b0000"/>
  <ellipse cx="145" cy="135" rx="15" ry="20" fill="#6b0000"/>
  <ellipse cx="255" cy="135" rx="15" ry="20" fill="#6b0000"/>
  <!-- Title -->
  <text x="200" y="270" font-family="Georgia, serif" font-size="28" fill="url(#gold1)" text-anchor="middle" font-weight="bold">BARRIO BOXER</text>
</svg>