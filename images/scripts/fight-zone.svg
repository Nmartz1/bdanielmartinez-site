<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <!-- Dragon silhouette -->
  <path d="M100,150 Q120,100 160,110 Q180,90 200,100 Q240,80 260,110 Q280,100 300,130 Q320,120 330,150 Q340,180 300,200 Q280,220 240,210 Q200,230 160,210 Q120,220 100,190 Q80,170 100,150" fill="#2a2a5a" opacity="0.6"/>
  <!-- Crossed swords -->
  <line x1="120" y1="200" x2="280" y2="80" stroke="url(#steel)" stroke-width="6" stroke-linecap="round"/>
  <line x1="280" y1="200" x2="120" y2="80" stroke="url(#steel)" stroke-width="6" stroke-linecap="round"/>
  <!-- Sword handles -->
  <rect x="105" y="195" width="30" height="10" fill="#4a3c2a" transform="rotate(-45 120 200)"/>
  <rect x="265" y="195" width="30" height="10" fill="#4a3c2a" transform="rotate(45 280 200)"/>
  <!-- Energy burst -->
  <circle cx="200" cy="140" r="20" fill="#ff4444" opacity="0.3"/>
  <circle cx="200" cy="140" r="10" fill="#ff6666" opacity="0.5"/>
  <!-- Title -->
  <text x="200" y="270" font-family="Impact, sans-serif" font-size="32" fill="#e0e0e0" text-anchor="middle" letter-spacing="4">FIGHT ZONE</text>
</svg>