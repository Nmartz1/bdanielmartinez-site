<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0519"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8844aa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#8844aa;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  <!-- Mysterious glow -->
  <ellipse cx="200" cy="140" rx="100" ry="80" fill="url(#glow)"/>
  <!-- Eyes -->
  <ellipse cx="160" cy="120" rx="25" ry="15" fill="#1a0a2e" stroke="#8844aa" stroke-width="2"/>
  <ellipse cx="240" cy="120" rx="25" ry="15" fill="#1a0a2e" stroke="#8844aa" stroke-width="2"/>
  <circle cx="160" cy="120" r="6" fill="#aa66cc"/>
  <circle cx="240" cy="120" r="6" fill="#aa66cc"/>
  <circle cx="162" cy="118" r="2" fill="#fff"/>
  <circle cx="242" cy="118" r="2" fill="#fff"/>
  <!-- Ghostly wisps -->
  <path d="M100,200 Q120,180 140,200 Q160,220 180,200" fill="none" stroke="#6633aa" stroke-width="2" opacity="0.5"/>
  <path d="M220,200 Q240,180 260,200 Q280,220 300,200" fill="none" stroke="#6633aa" stroke-width="2" opacity="0.5"/>
  <!-- Heart with crack -->
  <path d="M200,160 C200,145 175,135 175,155 C175,175 200,195 200,195 C200,195 225,175 225,155 C225,135 200,145 200,160" fill="#660033" stroke="#aa3366" stroke-width="2"/>
  <line x1="195" y1="155" x2="205" y2="185" stroke="#1a0a2e" stroke-width="2"/>
  <!-- Title -->
  <text x="200" y="265" font-family="Georgia, serif" font-size="24" fill="#aa66cc" text-anchor="middle" font-style="italic">You and Only You</text>
</svg>