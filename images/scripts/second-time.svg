<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2817"/>
      <stop offset="100%" style="stop-color:#1a1008"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7e5f"/>
      <stop offset="50%" style="stop-color:#feb47b"/>
      <stop offset="100%" style="stop-color:#ffdb58"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>
  <!-- Sunset circle -->
  <circle cx="200" cy="180" r="60" fill="url(#sunset)" opacity="0.8"/>
  <!-- Silhouette of two people -->
  <ellipse cx="170" cy="140" rx="15" ry="18" fill="#1a1008"/>
  <path d="M155,155 L155,200 L185,200 L185,155" fill="#1a1008"/>
  <ellipse cx="230" cy="140" rx="15" ry="18" fill="#1a1008"/>
  <path d="M215,155 L215,200 L245,200 L245,155" fill="#1a1008"/>
  <!-- Clock hands suggesting "second time" -->
  <circle cx="200" cy="80" r="30" fill="none" stroke="#d4af37" stroke-width="2"/>
  <line x1="200" y1="80" x2="200" y2="60" stroke="#d4af37" stroke-width="2"/>
  <line x1="200" y1="80" x2="215" y2="85" stroke="#d4af37" stroke-width="2"/>
  <circle cx="200" cy="80" r="3" fill="#d4af37"/>
  <!-- Title -->
  <text x="200" y="265" font-family="Georgia, serif" font-size="24" fill="#feb47b" text-anchor="middle" font-style="italic">Second Time Around</text>
</svg>