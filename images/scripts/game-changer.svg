<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3d1a"/>
      <stop offset="100%" style="stop-color:#0d260d"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <!-- Baseball diamond -->
  <polygon points="200,80 280,150 200,220 120,150" fill="none" stroke="#8b7355" stroke-width="3"/>
  <!-- Bases -->
  <rect x="190" y="70" width="20" height="20" fill="#fff" transform="rotate(45 200 80)"/>
  <rect x="270" y="140" width="15" height="15" fill="#fff" transform="rotate(45 277.5 147.5)"/>
  <rect x="190" y="210" width="15" height="15" fill="#fff" transform="rotate(45 197.5 217.5)"/>
  <rect x="112" y="142" width="15" height="15" fill="#fff" transform="rotate(45 119.5 149.5)"/>
  <!-- Baseball -->
  <circle cx="300" cy="100" r="25" fill="url(#ball)"/>
  <path d="M285,90 Q300,100 285,110" fill="none" stroke="#cc0000" stroke-width="2"/>
  <path d="M315,90 Q300,100 315,110" fill="none" stroke="#cc0000" stroke-width="2"/>
  <!-- Heart -->
  <path d="M200,180 C200,165 180,155 180,170 C180,185 200,200 200,200 C200,200 220,185 220,170 C220,155 200,165 200,180" fill="#cc4444" opacity="0.7"/>
  <!-- Title -->
  <text x="200" y="265" font-family="Georgia, serif" font-size="26" fill="#d4af37" text-anchor="middle" font-style="italic">The Game Changer</text>
</svg>